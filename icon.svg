<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Scanning Reticle Grid -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#1e293b" stroke-dasharray="8 8" stroke-width="2"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#334155" stroke-dasharray="4 6" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="6" fill="#38bdf8" filter="url(#neon)"/>

  <!-- Crosshairs -->
  <line x1="256" y1="36" x2="256" y2="76" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="436" x2="256" y2="476" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="36" y1="256" x2="76" y2="256" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="436" y1="256" x2="476" y2="256" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- Geometric 3D Craniofacial Wireframe -->
  <g filter="url(#neon)" stroke="url(#glow)" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Outer Jaw & Cranial Contour -->
    <polygon points="256,108 340,140 380,210 370,300 320,380 256,420 192,380 142,300 132,210 172,140" />

    <!-- Forehead & Mid-face Bridges -->
    <line x1="172" y1="140" x2="256" y2="180" />
    <line x1="340" y1="140" x2="256" y2="180" />
    <line x1="256" y1="108" x2="256" y2="180" />

    <!-- Orbits (Eyes) -->
    <polygon points="190,215 230,225 210,245 170,235" fill="rgba(56, 189, 248, 0.15)" stroke-width="2.5" />
    <polygon points="322,215 342,235 302,245 282,225" fill="rgba(56, 189, 248, 0.15)" stroke-width="2.5" />

    <!-- Nasal Bridge & Piriform Aperture -->
    <polygon points="256,180 240,290 256,310 272,290" fill="rgba(99, 102, 241, 0.1)" />
    <line x1="256" y1="180" x2="256" y2="310" stroke-width="2" />

    <!-- Cheekbones (Zygomatic Arches) -->
    <line x1="142" y1="300" x2="240" y2="290" />
    <line x1="370" y1="300" x2="272" y2="290" />
    <line x1="190" y1="215" x2="142" y2="300" />
    <line x1="322" y1="215" x2="370" y2="300" />

    <!-- Mouth & Philtrum Geometry -->
    <polygon points="215,348 256,340 297,348 256,368" fill="rgba(168, 85, 247, 0.2)" />
    <line x1="256" y1="310" x2="256" y2="340" />

    <!-- Chin & Menton Support Lines -->
    <line x1="215" y1="348" x2="256" y2="420" />
    <line x1="297" y1="348" x2="256" y2="420" />
    <line x1="320" y1="380" x2="256" y2="368" />
    <line x1="192" y1="380" x2="256" y2="368" />
  </g>

  <!-- Landmark Nodes -->
  <g fill="#38bdf8">
    <circle cx="256" cy="180" r="5" />
    <circle cx="256" cy="310" r="5" />
    <circle cx="256" cy="420" r="5" />
    <circle cx="170" cy="235" r="4" />
    <circle cx="342" cy="235" r="4" />
    <circle cx="142" cy="300" r="4" />
    <circle cx="370" cy="300" r="4" />
    <circle cx="192" cy="380" r="4" />
    <circle cx="320" cy="380" r="4" />
  </g>

  <!-- Golden Ratio Phi symbol overlay at bottom corner -->
  <text x="410" y="460" font-family="monospace" font-size="34" font-weight="900" fill="#f59e0b" opacity="0.8">Φ</text>
</svg>
